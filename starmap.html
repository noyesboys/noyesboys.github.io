<html lang="en"><head><meta charset="utf-8">

<title>Noyes Boys Genetic Constellation</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07060f;--ink:#ece9ff;--mut:#a29cc9;--gold:#ffd479;--grn:#4ade80;--panel:rgba(14,12,32,.94);--edge:rgba(160,150,230,.3);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;position:relative;overflow:hidden;background:radial-gradient(ellipse at 70% 15%,#1b1440 0,transparent 55%),radial-gradient(ellipse at 10% 90%,#0d2a2a 0,transparent 50%),var(--bg);color:var(--ink);font:14px/1.55 Inter,system-ui,sans-serif}
svg{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
svg.drag{cursor:grabbing}
header{position:absolute;top:14px;left:18px;max-width:300px}
h1{margin:0;font:600 25px/1.1 Fraunces,Georgia,serif}
header p{margin:4px 0 8px;color:var(--mut);font-size:13px}
.leg{display:grid;gap:5px;color:var(--mut);font-size:12px;margin-top:10px;pointer-events:none}
.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}
.leg u{display:inline-block;width:18px;margin-right:6px;vertical-align:3px;border-top:2px solid var(--gold)}
.leg u.d{border-top:2px dotted var(--grn)}
#q{width:100%;box-sizing:border-box;padding:8px 12px;border-radius:99px;border:1px solid var(--edge);background:var(--panel);color:var(--ink);font:inherit}
.tog{display:flex;align-items:center;gap:8px;margin:10px 0 0;font-size:13px;cursor:pointer}.tog input{accent-color:#ff9f43;width:17px;height:17px;margin:0}
.ctrl{position:absolute;left:18px;bottom:18px;display:flex;gap:6px}
.ctrl button{width:38px;height:38px;border-radius:50%;border:1px solid var(--edge);background:var(--panel);color:var(--ink);font-size:18px;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.star{cursor:pointer;outline:none;transition:opacity .25s}
.star .glow{opacity:.75;transition:opacity .2s,transform .2s;transform-box:fill-box;transform-origin:center}
.star:hover .glow,.star:focus-visible .glow,.star.sel .glow{opacity:1;transform:scale(1.4)}
.star text{font:600 16px Inter,system-ui,sans-serif;fill:#d9ffe6;text-anchor:middle;paint-order:stroke;stroke:#07060f;stroke-width:5px;stroke-linejoin:round;opacity:0;transition:opacity .2s;pointer-events:none}
.star.a text{fill:#fff;font-weight:400}
svg.near .star text,.star:hover text,.star:focus-visible text,.star.sel text,.star.rel text,.star.hub text{opacity:1}
.dim{opacity:.18}
.fig{fill:none;stroke:#fff;stroke-opacity:.13;stroke-width:1.2}
.fig.ring,.fig.banner{stroke:#e8d9a0;stroke-opacity:.42}.fig.leaf{stroke:#b9d98a;stroke-opacity:.4}.fig.leaf2{stroke:#b9d98a;stroke-opacity:.22}
#figs{transition:opacity .25s}#figs.dim{opacity:.35}
.edge,.cz{fill:none;stroke:var(--gold);stroke-width:2.4;opacity:0;transition:opacity .3s;pointer-events:none}
.edge.on{opacity:1}.edge.dp{stroke:#ff9f43}svg:not(.deep) .star.o,svg:not(.deep) .edge.dp{display:none}.star.o text{fill:#ffd9ad;font-weight:400}.star.g text{font-size:21px;fill:#fff0b8;stroke-width:6px}.star.g .glow{animation:pl 3.4s ease-in-out infinite}@keyframes pl{50%{opacity:.6;transform:scale(1.22)}}
.cz{stroke:var(--grn);stroke-width:2;stroke-dasharray:1 7;stroke-linecap:round;opacity:.95}
.bg circle{fill:#fff;animation:tw 4s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}
#card{box-sizing:border-box;position:absolute;right:16px;top:84px;width:340px;max-height:calc(100% - 104px);overflow:auto;background:var(--panel);border:1px solid var(--edge);border-radius:16px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.5);backdrop-filter:blur(10px);animation:pop .25s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
#card[hidden]{display:none}
#card h2{margin:0 30px 2px 0;font:600 26px/1.15 Fraunces,Georgia,serif}
.kind{font-size:12.5px;color:var(--grn)}.kind.a{color:#fff}.kind.o{color:#ff9f43}.kind.g{color:var(--gold)}
.badge{display:inline-block;margin-top:6px;padding:2px 10px;border-radius:99px;background:rgba(255,212,121,.15);color:var(--gold);font-size:12px}
#card p{margin:10px 0}
.bar{height:6px;border-radius:9px;background:linear-gradient(90deg,#6b4fd8,#4ade80);position:relative;margin:4px 0 2px}
.bar i{position:absolute;top:-4px;width:4px;height:14px;border-radius:2px;background:#fff}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:12px 0}
.stats div{background:rgba(160,150,230,.1);border-radius:10px;padding:7px 10px}
.stats .w{grid-column:1/-1}
.stats b{display:block;color:var(--mut);font-weight:400;font-size:12px}
.tags span{display:inline-block;margin:0 5px 5px 0;padding:2px 10px;border-radius:99px;border:1px solid var(--edge);font-size:12.5px}
.note{color:var(--mut);font-size:12.5px}
.chips{margin:12px 0 0}.chips>span{display:block;color:var(--mut);font-size:12px;margin-bottom:5px}
.chips button{margin:0 6px 6px 0;padding:5px 11px;border-radius:99px;border:1px solid var(--edge);background:transparent;color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.chips button:hover{border-color:var(--gold)}
.cta{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.cta a{padding:10px 16px;border-radius:99px;text-decoration:none;font-weight:600;font-size:13.5px;border:1px solid var(--edge);color:var(--ink)}
.cta a.p{background:var(--grn);color:#052e16;border-color:var(--grn)}
#x{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.08);color:var(--ink);font-size:18px;cursor:pointer}
.hint{position:absolute;right:18px;bottom:16px;color:var(--mut);font-size:12px;pointer-events:none}
@media(max-width:700px){header{max-width:none;right:18px}h1{font-size:21px}header p{display:none}.leg{grid-template-columns:1fr 1fr;margin-top:8px}.hint{display:none}
#card{left:0;right:0;top:auto;bottom:0;width:auto;max-height:58%;border-radius:18px 18px 0 0}.ctrl{bottom:auto;top:auto;left:auto;right:14px;bottom:18px;flex-direction:column}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
